name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Validation build only (read-only token); the write-authorized
  # release lives in release.yml and runs solely on tag pushes.
  build:
    needs: check
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-exes.yml@v1
    with:
      build-deps: libdbus-1-dev