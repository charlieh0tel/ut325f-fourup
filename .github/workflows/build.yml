name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A SHA-pinned rust-toolchain cannot take the channel from the ref the
      # way @stable did, so it is named here.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo check --lib --locked --no-default-features
      - run: cargo clippy --lib --tests --locked --no-default-features --features serial -- -D warnings
      - run: cargo test --locked --no-default-features --features serial
      - run: cargo clippy --lib --tests --locked --no-default-features --features ble -- -D warnings
      - run: cargo test --locked --no-default-features --features ble

  # Validation build only (read-only token); the write-authorized
  # release lives in release.yml and runs solely on tag pushes.
  build:
    needs: check
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-exes.yml@v1
    with:
      build-deps: libdbus-1-dev