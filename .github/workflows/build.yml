name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo check --lib --locked --no-default-features
      - run: cargo clippy --lib --tests --locked --no-default-features --features serial -- -D warnings
      - run: cargo test --locked --no-default-features --features serial
      - run: cargo clippy --lib --tests --locked --no-default-features --features ble -- -D warnings
      - run: cargo test --locked --no-default-features --features ble

  # Validation build; releases happen in release.yml on tag pushes.
  # contents:write is forced here: the reusable workflow's release job
  # declares it, and a caller granting less fails at startup - even
  # though that job never runs off a tag. Droppable once deb-workflows
  # stops declaring job-level permissions.
  build:
    needs: check
    permissions:
      contents: write
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-exes.yml@main
    with:
      build-deps: libdbus-1-dev
